name: Deploy landing page to GitHub Pages

# Publishes the static marketing landing page in docs/ to GitHub Pages.
#
# NOTE: GitHub Pages can only host static files, so this deploys the LANDING
# PAGE ONLY. The full app (auth, database, MT5 sync, API routes, billing, chat,
# share cards) needs a Node host — see DEPLOYMENT.md for Vercel setup.
#
# Setup (one time):
#   1. Settings → Pages → Build and deployment → Source: "GitHub Actions".
#   2. (Optional) Settings → Secrets and variables → Actions → Variables:
#      add a repository variable APP_URL with your deployed app's URL
#      (e.g. https://greek-journal.vercel.app). The landing page's buttons
#      will point there. Without it, they fall back to the repo URL.

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject app URL
        env:
          APP_URL: ${{ vars.APP_URL || github.server_url }}/${{ github.repository }}
        run: |
          # Replace the __APP_URL__ placeholder with the configured app URL.
          sed -i "s|__APP_URL__|${APP_URL}|g" docs/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
