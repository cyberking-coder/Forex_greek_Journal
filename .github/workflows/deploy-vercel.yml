name: Deploy to Vercel (production)

# Builds and deploys the full app to Vercel, running database migrations first.
#
# This is an ALTERNATIVE to Vercel's native Git integration — use one or the
# other, not both. If you connect the repo in the Vercel dashboard, you don't
# need this workflow. Use this when you want CI to own the deploy (e.g. to run
# `prisma migrate deploy` as a gated step before going live).
#
# Required GitHub Actions secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN        - https://vercel.com/account/tokens
#   VERCEL_ORG_ID       - from `.vercel/project.json` after `vercel link`
#   VERCEL_PROJECT_ID   - from `.vercel/project.json` after `vercel link`
#   DATABASE_URL        - (optional) pooled Postgres URL for migrations
#   DIRECT_URL          - (optional) direct Postgres URL for migrations
#
# App runtime env vars (AUTH_SECRET, ENCRYPTION_KEY, METAAPI_TOKEN, etc.) are
# configured in the Vercel project settings and pulled by `vercel pull`.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Run database migrations
        if: ${{ env.DIRECT_URL != '' || env.DATABASE_URL != '' }}
        run: |
          npm ci
          npx prisma migrate deploy

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
